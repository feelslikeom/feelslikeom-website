name: Fix mobile navigation v2

on:
  push:
    paths:
      - 'scripts/fix-mobile-nav-v2.py'
      - '.github/workflows/fix-mobile-navigation-v2.yml'

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile navigation standardisation
        run: python3 scripts/fix-mobile-nav-v2.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/pages website/public/type-system.css website/public/mobile-nav.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Standardise mobile navigation across site"
            git push origin main
          fi
