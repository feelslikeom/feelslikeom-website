name: Run mobile navigation standardisation

on:
  push:
    paths:
      - '.github/workflows/run-standardize-mobile-nav.yml'

permissions:
  contents: write

jobs:
  standardise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 website/scripts/standardize-mobile-nav.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/pages website/public/type-system.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Standardise full mobile navigation on all pages"
            git push origin main
          fi
