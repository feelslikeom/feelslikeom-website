name: Darken homepage reflections once

on:
  push:
    paths:
      - '.github/workflows/homepage-reflections-darker-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Darken homepage reflections overlay
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('website/src/pages/index.astro')
          text = path.read_text()
          old = 'background:rgba(24,48,31,.52);'
          new = 'background:rgba(24,48,31,.68);'
          if old not in text:
              raise RuntimeError('Expected reflections overlay opacity not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-off workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/homepage-reflections-darker-once.yml
          git add website/src/pages/index.astro
          git commit -m "Darken homepage reflections background"
          git push origin main
