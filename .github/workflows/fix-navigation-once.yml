name: Standardise mobile navigation everywhere

on:
  push:
    paths:
      - '.github/workflows/fix-navigation-once.yml'

permissions:
  contents: write

jobs:
  standardise-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Standardise navigation markup and script across public pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('website/src/pages/index.astro'),
              Path('website/src/pages/about/our-stories.astro'),
              Path('website/src/pages/about/getting-to-sikkim.astro'),
              Path('website/src/pages/about/visa-and-permits.astro'),
              Path('website/src/pages/about/life-on-sikkim-time.astro'),
              Path('website/src/pages/journeys/the-flagship.astro'),
              Path('website/src/pages/journeys/to-be-free.astro'),
              Path('website/src/pages/reflections.astro'),
              Path('website/src/pages/contact.astro'),
          ]

          def current_states(path):
              s = str(path)
              about = '/about/' in s
              journeys = '/journeys/' in s
              reflections = s.endswith('/reflections.astro')
              contact = s.endswith('/contact.astro')
              return about, journeys, reflections, contact

          def nav_markup(path):
              about, journeys, reflections, contact = current_states(path)
              about_summary = '<summary class="active">ABOUT</summary>' if about else '<summary>ABOUT</summary>'
              journeys_summary = '<summary class="active">JOURNEYS</summary>' if journeys else '<summary>JOURNEYS</summary>'
              refl_attr = ' class="active" aria-current="page"' if reflections else ''
              contact_attr = ' class="active" aria-current="page"' if contact else ''
              return f'''<nav class="main-nav" aria-label="Main navigation">
        <details class="nav-dropdown">
          {about_summary}
          <div class="submenu">
            <a href="/about/our-stories">Our stories</a>
            <a href="/about/getting-to-sikkim">Getting to Sikkim</a>
            <a href="/about/visa-and-permits">Visa and permits</a>
            <a href="/about/life-on-sikkim-time">Life on Sikkim time</a>
          </div>
        </details>
        <details class="nav-dropdown">
          {journeys_summary}
          <div class="submenu">
            <a href="/journeys/the-flagship">The Flagship</a>
            <a href="/journeys/how-to-embrace-suffering">To Be Free</a>
          </div>
        </details>
        <a href="/reflections"{refl_attr}>REFLECTIONS</a>
        <a href="/contact"{contact_attr}>CONTACT</a>
      </nav>'''

          nav_re = re.compile(r'<nav class="main-nav" aria-label="Main navigation">.*?</nav>', re.S)
          changed = []
          checked = []

          for path in targets:
              if not path.exists():
                  raise SystemExit(f'Missing expected page: {path}')
              text = path.read_text()
              original = text

              if not nav_re.search(text):
                  raise SystemExit(f'Main navigation not found in {path}')
              text = nav_re.sub(nav_markup(path), text, count=1)

              if 'class="mobile-nav-toggle"' not in text:
                  raise SystemExit(f'Mobile nav button missing in {path}')

              if '/mobile-nav.js' not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'No </body> in {path}')
                  text = text.replace('</body>', '  <script src="/mobile-nav.js" is:inline></script>\n  </body>', 1)

              path.write_text(text)
              checked.append(str(path))
              if text != original:
                  changed.append(str(path))

          # Remove the legacy pseudo-label that caused "Our storyOur stories".
          css_path = Path('website/public/type-system.css')
          css = css_path.read_text()
          css2 = re.sub(r'\n?\.main-nav \.submenu a\[href="/about/our-story"\] \{ font-size:0!important; \}\n?', '\n', css)
          css2 = re.sub(r'\n?\.main-nav \.submenu a\[href="/about/our-story"\]::after \{ content:"Our stories"; font-family:var\(--font-body\); font-size:var\(--type-small\); \}\n?', '\n', css2)
          if css2 != css:
              css_path.write_text(css2)
              changed.append(str(css_path))

          # Verification: all nine pages must have the same required menu items and script.
          required = [
              '/about/our-stories',
              '/about/getting-to-sikkim',
              '/about/visa-and-permits',
              '/about/life-on-sikkim-time',
              '/journeys/the-flagship',
              '/journeys/how-to-embrace-suffering',
              '/reflections',
              '/contact',
              '/mobile-nav.js',
          ]
          forbidden = [
              '/journeys#feels-like-home',
              '/journeys#way-of-the-yaks',
              '>Our story<',
          ]
          for path in targets:
              text = path.read_text()
              for item in required:
                  if item not in text:
                      raise SystemExit(f'Verification failed: {item} missing from {path}')
              for item in forbidden:
                  if item in text:
                      raise SystemExit(f'Verification failed: {item} still present in {path}')

          print('Verified mobile navigation on:')
          for path in checked:
              print(' -', path)
          print('Changed:')
          for path in changed:
              print(' -', path)
          PY

      - name: Commit navigation standardisation
        run: |
          if git diff --quiet; then
            echo "All navigation files already standardised."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/pages website/public/type-system.css
          git commit -m "Standardise mobile navigation across all pages"
          git push origin main
